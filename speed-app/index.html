<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Speed Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .speed-display {
            text-align: center;
            margin: 30px 0;
        }

        .speed-value {
            font-size: 72px;
            font-weight: bold;
            color: #667eea;
            line-height: 1;
        }

        .speed-unit {
            font-size: 24px;
            color: #666;
            margin-top: 10px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 30px 0;
        }

        .info-box {
            background: #f7f7f7;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .info-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .start-btn {
            background: #667eea;
            color: white;
        }

        .start-btn:hover {
            background: #5a67d8;
        }

        .stop-btn {
            background: #ef4444;
            color: white;
        }

        .stop-btn:hover {
            background: #dc2626;
        }

        .unit-toggle {
            background: #f7f7f7;
            color: #333;
        }

        .unit-toggle:hover {
            background: #e5e5e5;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }

        .status.active {
            background: #d4edda;
            color: #155724;
        }

        .status.inactive {
            background: #f8d7da;
            color: #721c24;
        }

        .status.waiting {
            background: #fff3cd;
            color: #856404;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>GPS Speed Tracker</h1>
        
        <div class="speed-display">
            <div class="speed-value" id="speed">0</div>
            <div class="speed-unit" id="speedUnit">km/h</div>
        </div>

        <div class="info-grid">
            <div class="info-box">
                <div class="info-label">Max Speed</div>
                <div class="info-value" id="maxSpeed">0</div>
            </div>
            <div class="info-box">
                <div class="info-label">Avg Speed</div>
                <div class="info-value" id="avgSpeed">0</div>
            </div>
            <div class="info-box">
                <div class="info-label">Distance</div>
                <div class="info-value" id="distance">0</div>
            </div>
            <div class="info-box">
                <div class="info-label">Duration</div>
                <div class="info-value" id="duration">00:00</div>
            </div>
        </div>

        <div class="controls">
            <button class="start-btn" id="startBtn">Start Tracking</button>
            <button class="stop-btn" id="stopBtn" disabled>Stop</button>
            <button class="unit-toggle" id="unitBtn">mph</button>
        </div>

        <div class="status inactive" id="status">GPS Inactive</div>
        <div class="error" id="error" style="display: none;"></div>
        
        <div style="margin-top: 20px; padding: 15px; background: #e3f2fd; border-radius: 10px; font-size: 14px;">
            <strong>macOS Location Fix:</strong><br>
            1. Open System Settings → Privacy & Security → Location Services<br>
            2. Ensure it's ON and your browser is allowed<br>
            3. For persistent issues, try Safari instead of Chrome<br>
            <button onclick="testLocation()" style="margin-top: 10px; padding: 8px 15px; background: #2196F3; color: white; border: none; border-radius: 5px; cursor: pointer;">Test Location Access</button>
        </div>
    </div>

    <script>
        class SpeedTracker {
            constructor() {
                this.watchId = null;
                this.isTracking = false;
                this.unit = 'kmh'; // kmh or mph
                this.speeds = [];
                this.maxSpeed = 0;
                this.totalDistance = 0;
                this.lastPosition = null;
                this.startTime = null;
                this.updateInterval = null;

                this.initElements();
                this.initEventListeners();
            }

            initElements() {
                this.speedEl = document.getElementById('speed');
                this.speedUnitEl = document.getElementById('speedUnit');
                this.maxSpeedEl = document.getElementById('maxSpeed');
                this.avgSpeedEl = document.getElementById('avgSpeed');
                this.distanceEl = document.getElementById('distance');
                this.durationEl = document.getElementById('duration');
                this.startBtn = document.getElementById('startBtn');
                this.stopBtn = document.getElementById('stopBtn');
                this.unitBtn = document.getElementById('unitBtn');
                this.statusEl = document.getElementById('status');
                this.errorEl = document.getElementById('error');
            }

            initEventListeners() {
                this.startBtn.addEventListener('click', () => this.startTracking());
                this.stopBtn.addEventListener('click', () => this.stopTracking());
                this.unitBtn.addEventListener('click', () => this.toggleUnit());
            }

            async startTracking() {
                if (!navigator.geolocation) {
                    this.showError('Geolocation is not supported by your browser');
                    return;
                }

                this.reset();
                this.isTracking = true;
                this.startTime = Date.now();
                this.startBtn.disabled = true;
                this.stopBtn.disabled = false;
                
                this.updateStatus('Requesting location permission...', 'waiting');
                
                // First check if we have permission
                if (navigator.permissions) {
                    try {
                        const permission = await navigator.permissions.query({ name: 'geolocation' });
                        console.log('Location permission state:', permission.state);
                        
                        if (permission.state === 'denied') {
                            this.showError('Location access denied. Please enable in browser settings.');
                            this.stopTracking();
                            return;
                        }
                    } catch (e) {
                        console.log('Could not check permission:', e);
                    }
                }

                this.updateStatus('Acquiring GPS signal...', 'waiting');
                
                // Start with very permissive options for macOS
                const initialOptions = {
                    enableHighAccuracy: false,
                    timeout: 30000, // 30 second timeout
                    maximumAge: 60000 // Accept positions up to 1 minute old
                };
                
                // Try to get initial position first
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        console.log('Initial position acquired:', position);
                        this.handlePosition(position);
                        
                        // Now start watching with better accuracy
                        this.startWatching();
                    },
                    (error) => {
                        console.warn('Initial position failed, trying watch anyway:', error);
                        // Even if getCurrentPosition fails, try watching
                        this.startWatching();
                    },
                    initialOptions
                );

                // Update duration every second
                this.updateInterval = setInterval(() => this.updateDuration(), 1000);
            }
            
            startWatching() {
                // Progressive accuracy strategy
                const watchOptions = {
                    enableHighAccuracy: this.lastPosition ? true : false, // Only high accuracy after first fix
                    timeout: 20000,
                    maximumAge: 2000
                };
                
                this.watchId = navigator.geolocation.watchPosition(
                    (position) => this.handlePosition(position),
                    (error) => this.handleError(error),
                    watchOptions
                );
            }

            stopTracking() {
                if (this.watchId !== null) {
                    navigator.geolocation.clearWatch(this.watchId);
                    this.watchId = null;
                }

                if (this.updateInterval) {
                    clearInterval(this.updateInterval);
                    this.updateInterval = null;
                }

                this.isTracking = false;
                this.startBtn.disabled = false;
                this.stopBtn.disabled = true;
                this.updateStatus('GPS Inactive', 'inactive');
            }

            handlePosition(position) {
                this.hideError();
                this.updateStatus('GPS Active', 'active');

                const { coords } = position;
                
                // Update current speed
                let speed = coords.speed || 0;
                if (speed < 0) speed = 0;
                
                // Convert m/s to km/h or mph
                const displaySpeed = this.convertSpeed(speed);
                this.speedEl.textContent = displaySpeed.toFixed(1);
                
                // Track speeds for average calculation
                if (speed > 0) {
                    this.speeds.push(speed);
                    
                    // Update max speed
                    if (speed > this.maxSpeed) {
                        this.maxSpeed = speed;
                        this.maxSpeedEl.textContent = this.convertSpeed(this.maxSpeed).toFixed(1);
                    }
                    
                    // Update average speed
                    const avgSpeed = this.speeds.reduce((a, b) => a + b, 0) / this.speeds.length;
                    this.avgSpeedEl.textContent = this.convertSpeed(avgSpeed).toFixed(1);
                }
                
                // Calculate distance
                if (this.lastPosition) {
                    const distance = this.calculateDistance(
                        this.lastPosition.coords.latitude,
                        this.lastPosition.coords.longitude,
                        coords.latitude,
                        coords.longitude
                    );
                    this.totalDistance += distance;
                    this.updateDistance();
                }
                
                this.lastPosition = position;
            }

            handleError(error) {
                let message = '';
                console.error('Geolocation error:', error);
                
                // Don't stop tracking on errors, just inform the user
                switch(error.code) {
                    case error.PERMISSION_DENIED:
                        message = 'Location permission denied. Enable in browser and System Settings > Privacy & Security > Location Services.';
                        this.stopTracking(); // Stop only on permission denied
                        break;
                    case error.POSITION_UNAVAILABLE:
                        message = 'Waiting for GPS signal... Make sure Location Services is ON in System Settings.';
                        // Keep trying, don't stop
                        break;
                    case error.TIMEOUT:
                        message = 'GPS signal weak. Still trying...';
                        // Keep trying, don't stop
                        break;
                    default:
                        message = `GPS issue: ${error.message}. Still attempting to acquire signal...`;
                }
                
                this.showError(message);
                
                // Only update status to error if we're not getting any position at all
                if (!this.lastPosition) {
                    this.updateStatus('Searching for GPS...', 'waiting');
                }
            }

            convertSpeed(speedMs) {
                if (this.unit === 'kmh') {
                    return speedMs * 3.6; // m/s to km/h
                } else {
                    return speedMs * 2.237; // m/s to mph
                }
            }

            calculateDistance(lat1, lon1, lat2, lon2) {
                const R = 6371e3; // Earth's radius in meters
                const φ1 = lat1 * Math.PI / 180;
                const φ2 = lat2 * Math.PI / 180;
                const Δφ = (lat2 - lat1) * Math.PI / 180;
                const Δλ = (lon2 - lon1) * Math.PI / 180;

                const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                        Math.cos(φ1) * Math.cos(φ2) *
                        Math.sin(Δλ/2) * Math.sin(Δλ/2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

                return R * c; // Distance in meters
            }

            updateDistance() {
                let distance;
                let unit;
                
                if (this.unit === 'kmh') {
                    distance = this.totalDistance / 1000; // Convert to km
                    unit = 'km';
                } else {
                    distance = this.totalDistance / 1609.344; // Convert to miles
                    unit = 'mi';
                }
                
                this.distanceEl.textContent = distance.toFixed(2) + ' ' + unit;
            }

            updateDuration() {
                if (!this.startTime || !this.isTracking) return;
                
                const elapsed = Date.now() - this.startTime;
                const seconds = Math.floor(elapsed / 1000) % 60;
                const minutes = Math.floor(elapsed / 60000) % 60;
                const hours = Math.floor(elapsed / 3600000);
                
                let duration = '';
                if (hours > 0) {
                    duration = `${hours}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                } else {
                    duration = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                }
                
                this.durationEl.textContent = duration;
            }

            toggleUnit() {
                this.unit = this.unit === 'kmh' ? 'mph' : 'kmh';
                this.speedUnitEl.textContent = this.unit === 'kmh' ? 'km/h' : 'mph';
                this.unitBtn.textContent = this.unit === 'kmh' ? 'mph' : 'km/h';
                
                // Update all displayed values
                if (this.lastPosition && this.lastPosition.coords.speed) {
                    const displaySpeed = this.convertSpeed(this.lastPosition.coords.speed);
                    this.speedEl.textContent = displaySpeed.toFixed(1);
                }
                
                this.maxSpeedEl.textContent = this.convertSpeed(this.maxSpeed).toFixed(1);
                
                if (this.speeds.length > 0) {
                    const avgSpeed = this.speeds.reduce((a, b) => a + b, 0) / this.speeds.length;
                    this.avgSpeedEl.textContent = this.convertSpeed(avgSpeed).toFixed(1);
                }
                
                this.updateDistance();
            }

            updateStatus(message, type) {
                this.statusEl.textContent = message;
                this.statusEl.className = `status ${type}`;
            }

            showError(message) {
                this.errorEl.textContent = message;
                this.errorEl.style.display = 'block';
            }

            hideError() {
                this.errorEl.style.display = 'none';
            }

            
            reset() {
                this.speeds = [];
                this.maxSpeed = 0;
                this.totalDistance = 0;
                this.lastPosition = null;
                this.startTime = null;
                
                this.speedEl.textContent = '0';
                this.maxSpeedEl.textContent = '0';
                this.avgSpeedEl.textContent = '0';
                this.distanceEl.textContent = '0';
                this.durationEl.textContent = '00:00';
            }
        }

        // Initialize the app
        const tracker = new SpeedTracker();
        
        // Test location function for debugging
        function testLocation() {
            const testBtn = event.target;
            testBtn.disabled = true;
            testBtn.textContent = 'Testing...';
            
            const options = {
                enableHighAccuracy: false,
                timeout: 30000,
                maximumAge: 300000 // Accept very old positions for testing
            };
            
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    alert(`Success! Location acquired:\nLatitude: ${position.coords.latitude}\nLongitude: ${position.coords.longitude}\nAccuracy: ${position.coords.accuracy}m`);
                    testBtn.textContent = 'Location Works!';
                    testBtn.style.background = '#4CAF50';
                },
                (error) => {
                    let msg = `Error ${error.code}: ${error.message}\n\n`;
                    msg += 'Troubleshooting:\n';
                    msg += '1. Open System Settings > Privacy & Security > Location Services\n';
                    msg += '2. Make sure it\'s ON\n';
                    msg += '3. Find your browser and ensure it has permission\n';
                    msg += '4. Try Safari if using Chrome\n';
                    msg += '5. Restart your browser after changing settings';
                    alert(msg);
                    testBtn.textContent = 'Test Failed - See Instructions';
                    testBtn.style.background = '#f44336';
                    testBtn.disabled = false;
                },
                options
            );
        }
    </script>
</body>
</html>
